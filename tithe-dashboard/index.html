<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>奥克拉玛500世界什一税看板</title>
  <link href="../libs/bootstrap.min.css" rel="stylesheet">
  <style>
    .chart-box { height: 360px; }
    #status { display: none; }
  </style>
</head>
<body class="container py-4">
  <header>
    <h1 class="h3">奥克拉玛500世界什一税看板</h1>
    <p class="text-muted" id="sub-title">数据来源：课程统一虚构数据集</p>
  </header>

  <p id="status" class="alert alert-warning"></p>

  <div id="filters" class="btn-group mb-3" role="group" aria-label="地区筛选"></div>

  <section class="row g-3 mb-4" id="cards"></section>

  <section class="row g-3">
    <div class="col-lg-6">
      <h2 class="h5">各地区什一税额（ECharts柱状图 · 单位：万星币）</h2>
      <div id="bar-chart" class="chart-box"></div>
      <p class="small text-muted">数据来源：奥克拉玛世界什一税总局（虚构练习数据）</p>
    </div>
    <div class="col-lg-6">
      <h2 class="h5">什一税缴纳趋势（Chart.js折线图 · 单位：万星币）</h2>
      <div class="chart-box"><canvas id="line-chart"></canvas></div>
      <p class="small text-muted">数据来源：奥克拉玛世界什一税总局（虚构练习数据）</p>
    </div>
  </section>

  <script src="../libs/jquery-3.7.1.min.js"></script>
  <script src="../libs/bootstrap.bundle.min.js"></script>
  <script src="../libs/echarts.min.js"></script>
  <script src="../libs/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
